name: CI

on:
  push:
    branches:
      - main
      - master
      - "codex/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python tests and fixed offline E2E
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_DB: novel_system
          POSTGRES_USER: novel_user
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U novel_user -d novel_system"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MOCK_LLM: "true"
      PROJECT_BASE_PATH: /tmp/novel-ci-workspace
      SKILLS_PATH: /tmp/novel-ci-workspace/skills
      PGVECTOR_DSN: postgresql://novel_user:password@localhost:5432/novel_system
    defaults:
      run:
        working-directory: novel-system/python-services
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: novel-system/python-services/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Python unit tests
        run: python -m pytest tests --junitxml=pytest-report.xml

      - name: Run fixed MVP pipeline smoke
        working-directory: novel-system
        run: |
          rm -rf /tmp/novel-ci-workspace
          python scripts/smoke_mvp_pipeline.py --workspace /tmp/novel-ci-workspace --project-id ci_smoke_project --keep-workspace

      - name: Run pgvector migration and ANN rehearsal
        working-directory: novel-system
        run: |
          python scripts/pgvector_rehearsal.py --workspace /tmp/novel-ci-workspace --project-id ci_pgvector_rehearsal --keep-workspace --require-dsn

      - name: Upload Python test and smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-ci-artifacts
          if-no-files-found: ignore
          path: |
            novel-system/python-services/pytest-report.xml
            /tmp/novel-ci-workspace/projects/ci_smoke_project/analysis/coverage/*.json
            /tmp/novel-ci-workspace/projects/ci_smoke_project/analysis/per_chunk/**/summary.json
            /tmp/novel-ci-workspace/projects/ci_smoke_project/analysis/per_book/*.md
            /tmp/novel-ci-workspace/projects/ci_smoke_project/analysis/cross_book/*
            /tmp/novel-ci-workspace/projects/ci_smoke_project/skills/enabled.yaml
            /tmp/novel-ci-workspace/projects/ci_pgvector_rehearsal/indexes/pgvector_rehearsal_report.json

  java-tests:
    name: Java service tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_DB: novel_system
          POSTGRES_USER: novel_user
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U novel_user -d novel_system"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: novel-system/java-services
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run Maven tests
        run: mvn -B test

      - name: Validate Flyway migrations
        env:
          RUN_DB_MIGRATION_TEST: "true"
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/novel_system
          SPRING_DATASOURCE_USERNAME: novel_user
          SPRING_DATASOURCE_PASSWORD: password
          SPRING_FLYWAY_SCHEMAS: public
        run: mvn -B -Dtest=MigrationSchemaValidationTest test

      - name: Upload Maven test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-surefire-reports
          if-no-files-found: ignore
          path: novel-system/java-services/target/surefire-reports/

  frontend-build:
    name: Frontend typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: novel-system/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run fixed frontend browser smoke
        run: npm run e2e:ci

      - name: Upload frontend build and Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-ci-artifacts
          if-no-files-found: ignore
          path: |
            novel-system/frontend/dist/
            novel-system/frontend/playwright-report/
            novel-system/frontend/test-results/
