spring:
  application:
    name: novel-system
  
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/novel_system}
    username: ${SPRING_DATASOURCE_USERNAME:novel_user}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: true
    schemas: ${SPRING_FLYWAY_SCHEMAS:public}

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  http:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  web:
    resources:
      add-mappings: true

server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# Python服务配置
python:
  service:
    url: ${PYTHON_SERVICE_URL:http://localhost:8000}

# 文件存储配置
file:
  storage:
    base-path: ${PROJECT_BASE_PATH:/workspace}

# 日志配置
logging:
  level:
    root: INFO
    com.novel.system: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n"
