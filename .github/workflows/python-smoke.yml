name: Python Smoke

on:
  push:
    branches:
      - main
      - master
      - "codex/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-smoke:
    name: Python tests and offline MVP smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: novel-system

    env:
      MOCK_LLM: "true"
      PROJECT_BASE_PATH: /tmp/novel-ci-workspace
      SKILLS_PATH: /tmp/novel-ci-workspace/skills

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: novel-system/python-services/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r python-services/requirements.txt

      - name: Run Python test suite
        working-directory: novel-system/python-services
        run: python -m pytest tests -q --junitxml=pytest-report.xml

      - name: Run offline MVP pipeline smoke
        run: |
          rm -rf /tmp/novel-ci-workspace
          python scripts/smoke_mvp_pipeline.py --workspace /tmp/novel-ci-workspace --project-id python_smoke_project --keep-workspace

      - name: Upload Python smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-smoke-artifacts
          if-no-files-found: ignore
          path: |
            novel-system/python-services/pytest-report.xml
            /tmp/novel-ci-workspace/projects/python_smoke_project/analysis/coverage/*.json
            /tmp/novel-ci-workspace/projects/python_smoke_project/analysis/per_chunk/**/summary.json
            /tmp/novel-ci-workspace/projects/python_smoke_project/analysis/per_book/*.md
            /tmp/novel-ci-workspace/projects/python_smoke_project/analysis/cross_book/*
            /tmp/novel-ci-workspace/projects/python_smoke_project/skills/enabled.yaml
