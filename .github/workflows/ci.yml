name: CI

on:
  push:
    branches:
      - main
      - master
      - "codex/**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python tests and fixed offline E2E
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: novel-system/python-services
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: novel-system/python-services/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Python unit tests
        run: python -m pytest tests

      - name: Run fixed MVP pipeline smoke
        working-directory: novel-system
        run: python scripts/smoke_mvp_pipeline.py --project-id ci_smoke_project

  java-tests:
    name: Java service tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_DB: novel_system
          POSTGRES_USER: novel_user
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U novel_user -d novel_system"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: novel-system/java-services
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run Maven tests
        run: mvn -B test

      - name: Validate Flyway migrations
        env:
          RUN_DB_MIGRATION_TEST: "true"
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/novel_system
          SPRING_DATASOURCE_USERNAME: novel_user
          SPRING_DATASOURCE_PASSWORD: password
          SPRING_FLYWAY_SCHEMAS: public
        run: mvn -B -Dtest=MigrationSchemaValidationTest test

  frontend-build:
    name: Frontend typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: novel-system/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run fixed frontend browser smoke
        run: npm run e2e:ci
